services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-medresearch}
      POSTGRES_USER: ${POSTGRES_USER:-medresearch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medresearch_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-medresearch}:${POSTGRES_PASSWORD:-medresearch_dev_password}@db:5432/${POSTGRES_DB:-medresearch}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-this-in-production}
      GEMINI_API_KEY: ${GEMINI_API_KEY:?Set GEMINI_API_KEY in .env}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-flash-latest}
      NCBI_EMAIL: ${NCBI_EMAIL:?Set NCBI_EMAIL in .env}
      NCBI_API_KEY: ${NCBI_API_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:8080}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  postgres_data:
